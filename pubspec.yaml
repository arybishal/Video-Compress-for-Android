name: pure_compress
description: "PureCompress — 100% on-device Android video compressor. No cloud, no accounts, no ads."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # FFmpeg/ffprobe engine (community-maintained continuation of ffmpeg-kit,
  # full GPL build: libx264/libx265, MediaCodec, framemd5).
  ffmpeg_kit_flutter_new: ^4.6.7
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
